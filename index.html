<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning - Ex01</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Pinned Navigation Bar -->
    <nav class="navbar">
        <h2>My Dashboard</h2>
    </nav>

    <div class="main-content">
        <!-- 2. Card Container (relative) -->
        <div class="card">
            <!-- 3. Absolute Notification Badge -->
            <span class="badge">NEW</span>
            <h3>Notification Card</h3>
            <p>This card demonstrates absolute positioning anchored to a relative container.</p>
        </div>
    </div>

    <!-- 4. Fixed Back to Top Button -->
    <a href="#" class="back-to-top">Top ↑</a>

</body>
</html>
